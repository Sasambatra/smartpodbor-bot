[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "smartpodbor-bot"
version = "1.0.0"
description = "Русскоязычный Telegram-бот для подбора смартфонов"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "third_party/aiogram/LICENSE"]
requires-python = ">=3.11,<3.15"
keywords = ["telegram", "aiogram", "recommendation-engine", "smartphones", "portfolio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Russian",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "aiogram==3.31.0",
  "aiosqlite==0.22.1",
  "python-dotenv==1.2.4",
]

[project.urls]
Repository = "https://github.com/Sasambatra/smartpodbor-bot"
Issues = "https://github.com/Sasambatra/smartpodbor-bot/issues"
CI = "https://github.com/Sasambatra/smartpodbor-bot/actions"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10", "pytest-asyncio>=1.4,<2", "pytest-cov>=7,<8",
  "ruff>=0.14,<1", "build>=1.3,<2",
]

[project.scripts]
smartpodbor = "smartphone_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["smartphone_bot*"]

[tool.setuptools.package-data]
smartphone_bot = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["smartphone_bot"]
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
