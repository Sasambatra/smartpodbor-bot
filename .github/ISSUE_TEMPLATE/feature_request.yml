name: Feature request
description: Suggest a user problem to solve or an improvement to the catalog.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: For catalog changes, include the manufacturer specification source.
    validations:
      required: true
