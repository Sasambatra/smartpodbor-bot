name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Check style, tests, catalog, and generated demo
        run: make check PYTHON=python
      - name: Build and inspect distributions
        run: make build PYTHON=python
      - name: Smoke-test the installed wheel away from source files
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$(mktemp -d)"
          python -m smartphone_bot --check
          python -m smartphone_bot --demo --example

  container:
    name: Docker offline smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --tag smartpodbor:ci .
      - name: Verify catalog and demo without credentials
        run: |
          docker run --rm smartpodbor:ci python -m smartphone_bot --check
          docker run --rm smartpodbor:ci python -m smartphone_bot --demo --example
